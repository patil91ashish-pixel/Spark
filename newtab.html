<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Upside Down Background Layer -->
  <div class="upside-down-background" id="upside-down-background"></div>

  <div class="background-overlay"></div>

  <!-- Escape Message -->
  <div class="escape-message" id="escape-message">You've escaped the Upside Down</div>

  <!-- Celebration Elements -->
  <div class="celebration-container" id="celebration-container"></div>
  <div class="success-message" id="success-message">🎉 Goal crushed!</div>

  <!-- Pomodoro Complete Message -->
  <div class="pomodoro-complete-message" id="pomodoro-complete-message">Session complete!</div>

  <!-- Upside Down Particles -->
  <div class="upside-down-particles" id="upside-down-particles"></div>

  <!-- Vecna Presence (only visible in Upside Down mode) -->
  <div class="vecna-presence" id="vecna-presence">
    <div class="vecna-eyes">
      <div class="vecna-eye left"></div>
      <div class="vecna-eye right"></div>
    </div>
    <div class="vecna-silhouette"></div>
  </div>

  <!-- Organic Tendrils -->
  <div class="tendrils-container">
    <div class="tendril tendril-1"></div>
    <div class="tendril tendril-2"></div>
    <div class="tendril tendril-3"></div>
    <div class="tendril tendril-4"></div>
  </div>

  <!-- Vecna Message -->
  <div class="vecna-message" id="vecna-message">Complete your goal to escape...</div>

  <div class="container">
    <!-- Top Section: Time and Date -->
    <div class="top-section">
      <div class="time" id="time">00:00</div>
      <div class="date" id="date">Loading...</div>
    </div>

    <!-- Middle Section: Greeting and Main Focus -->
    <div class="middle-section">
      <div class="greeting" id="greeting">Hello</div>

      <div class="focus-section">
        <div class="goal-container">
          <input type="checkbox" class="goal-checkbox" id="goal-checkbox" title="Mark goal as complete">
          <div
            class="focus-input"
            id="focus-input"
            contenteditable="true"
            data-placeholder="What is your main focus for today?"
          ></div>
        </div>
      </div>

      <!-- Pomodoro Timer Section -->
      <div class="pomodoro-section" id="pomodoro-section">
        <div class="pomodoro-timer" id="pomodoro-timer">25:00</div>
        <div class="pomodoro-controls">
          <button class="pomodoro-btn" id="pomodoro-start">Start</button>
          <button class="pomodoro-btn pomodoro-reset" id="pomodoro-reset">Reset</button>
        </div>
        <div class="pomodoro-status" id="pomodoro-status">🍅 Focus Session - 1/4</div>
      </div>
    </div>

    <!-- Bottom Section: Quote -->
    <div class="bottom-section">
      <div class="quote-container">
        <div class="quote" id="quote">Loading quote...</div>
        <div class="quote-author-container">
          <div class="quote-author" id="quote-author"></div>
          <button class="refresh-quote-btn" id="refresh-quote-btn" title="New quote">🔄</button>
        </div>
      </div>
    </div>

    <!-- Settings Button -->
    <button class="settings-btn" id="settings-btn">⚙️</button>

    <!-- Refresh Background Button -->
    <button class="refresh-bg-btn" id="refresh-bg-btn" title="New background image">🔄</button>

    <!-- Photo Attribution -->
    <div class="photo-attribution" id="photo-attribution" style="display: none;">
      Photo by <a href="#" target="_blank" rel="noopener" id="photographer-link"></a> on
      <a href="https://unsplash.com/?utm_source=spark_extension&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a>
    </div>

    <!-- Demogorgon Trigger Icon -->
    <div class="demogorgon-trigger" id="demogorgon-trigger" title="Enter the Upside Down">
      👹
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel">
      <h3>Settings</h3>

      <div class="setting-item">
        <label for="bg-mode">Background Source:</label>
        <select id="bg-mode">
          <option value="unsplash">Unsplash API (Dynamic)</option>
          <option value="static">Static Images</option>
        </select>
      </div>

      <div class="setting-item" id="unsplash-settings">
        <label for="api-key-input">Unsplash API Key:</label>
        <input
          type="password"
          id="api-key-input"
          class="api-key-input"
          placeholder="Enter your Unsplash API key..."
        >
        <button class="save-api-key-btn" id="save-api-key-btn">Save Key</button>
        <div class="api-key-status" id="api-key-status"></div>
        <p class="api-help-text">
          Get your free API key from
          <a href="https://unsplash.com/developers" target="_blank" rel="noopener">Unsplash Developers</a>
        </p>
      </div>

      <div class="setting-item" id="static-settings" style="display: none;">
        <label for="bg-select">Background:</label>
        <select id="bg-select">
          <option value="0">Nature 1</option>
          <option value="1">Nature 2</option>
          <option value="2">Mountains</option>
          <option value="3">Ocean</option>
          <option value="4">Forest</option>
        </select>
      </div>

      <button class="close-settings" id="close-settings">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
